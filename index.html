<!DOCTYPE html>
<html>
<head>
    <title>RTVis WebGPU Tutorial</title>
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgo=">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: black;
            border: 2px solid rgb(135, 135, 135);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            height: calc(100vmin - 100px);
            width: calc(100vmin - 100px);
        }
    </style>
</head>
<body>
<!-- GUI -->
<script type="module">
    import { Tutorial } from "./src/tutorial.js";
    import GUI from "./lib/lil-gui.esm.js";

    // Initialize GUI
    const gui = new GUI({ name: document.title });

    // Initialize canvas
    const canvas = document.createElement("canvas");
    document.body.appendChild(canvas);

    // Start tutorial
    const tutorial = new Tutorial(gui, canvas);
    tutorial.start();
</script>

</body>
</html>
